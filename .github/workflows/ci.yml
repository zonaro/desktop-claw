name: CI

on:
  push:
    branches:
      - development
      - main
  pull_request:
  # Publishes a release on demand, without waiting for a push to main.
  workflow_dispatch:
  workflow_call:
    inputs:
      repository:
        default: desktop/desktop
        required: false
        type: string
      ref:
        required: true
        type: string
      upload-artifacts:
        default: false
        required: false
        type: boolean
      environment:
        type: string
        required: true
      sign:
        type: boolean
        default: true
        required: false
      error-reporting-endpoint:
        type: string
        required: false
      non-fatal-error-reporting-endpoint:
        type: string
        required: false
    secrets:
      AZURE_CODE_SIGNING_TENANT_ID:
      AZURE_CODE_SIGNING_CLIENT_ID:
      DESKTOP_OAUTH_CLIENT_ID:
      DESKTOP_OAUTH_CLIENT_SECRET:
      DESKTOP_OAUTH_CLIENT_ID_BITBUCKET:
      DESKTOP_OAUTH_CLIENT_SECRET_BITBUCKET:
      DESKTOP_OAUTH_CLIENT_ID_GITLAB:
      DESKTOP_OAUTH_CLIENT_SECRET_GITLAB:
      DESKTOP_OAUTH_CLIENT_ID_CODEBERG:
      DESKTOP_OAUTH_CLIENT_SECRET_CODEBERG:
      DESKTOP_OAUTH_CLIENT_ID_GITEA:
      DESKTOP_OAUTH_CLIENT_SECRET_GITEA:
      APPLE_ID:
      APPLE_ID_PASSWORD:
      APPLE_TEAM_ID:
      APPLE_APPLICATION_CERT:
      APPLE_APPLICATION_CERT_PASSWORD:

env:
  NODE_VERSION: 24.15.0
  DESKTOP_ERROR_REPORTING_ENDPOINT: ${{ inputs.error-reporting-endpoint }}
  DESKTOP_NON_FATAL_ERROR_REPORTING_ENDPOINT:
    ${{ inputs.non-fatal-error-reporting-endpoint }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_CHANNEL: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn
      - run: yarn validate-electron-version
      - run: yarn lint
      - run: yarn validate-changelog
      - name: Ensure a clean working directory
        run: git diff --name-status --exit-code

  compute_version:
    name: Compute app version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      APP_VERSION: ${{ steps.compute.outputs.APP_VERSION }}
      # The calendar version is already strict semver, which is what Squirrel
      # (and therefore the Windows release) requires, so there's nothing to
      # rewrite.
      SEMVER_COMPATIBLE_VERSION: ${{ steps.compute.outputs.APP_VERSION }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Stamp version from the build date and time
        id: compute
        run: |
          # script/calendar-version.ts is the single source of truth for the
          # format ({YY}.{dayOfYear}.{HHMM}, UTC). Node strips the types on its
          # own and the file has no imports, so this runs without installing
          # any dependencies.
          #
          # Computed once here and handed to every job below, so that all
          # platforms in a release share one version.
          VERSION=$(node script/calendar-version.ts)
          echo "Computed version: ${VERSION}"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.friendlyName }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    needs: compute_version
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-latest]
        arch: [x64, arm64]
        include:
          - os: macos-14
            friendlyName: macOS
          - os: windows-2022
            friendlyName: Windows
          - os: ubuntu-latest
            friendlyName: Linux
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    env:
      RELEASE_CHANNEL: ${{ inputs.environment }}
      # build:prod expects APP_VERSION to be set in the environment
      APP_VERSION: ${{ needs.compute_version.outputs.APP_VERSION }}
      SEMVER_COMPATIBLE_VERSION:
        ${{ needs.compute_version.outputs.SEMVER_COMPATIBLE_VERSION }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          submodules: recursive
      - uses: ./.github/actions/setup-ci-environment
        with:
          node-version: ${{ env.NODE_VERSION }}
          arch: ${{ matrix.arch }}
      - name: Validate macOS version
        if: runner.os == 'macOS'
        run: yarn validate-macos-version
      - name: Run desktop-trampoline tests
        run: |
          cd vendor/desktop-trampoline
          yarn install
          yarn test
      - name: Build production app
        run: yarn build:prod
        env:
          DESKTOP_OAUTH_CLIENT_ID: ${{ secrets.DESKTOP_OAUTH_CLIENT_ID }}
          DESKTOP_OAUTH_CLIENT_SECRET:
            ${{ secrets.DESKTOP_OAUTH_CLIENT_SECRET }}
          DESKTOP_OAUTH_CLIENT_ID_BITBUCKET:
            ${{ secrets.DESKTOP_OAUTH_CLIENT_ID_BITBUCKET }}
          DESKTOP_OAUTH_CLIENT_SECRET_BITBUCKET:
            ${{ secrets.DESKTOP_OAUTH_CLIENT_SECRET_BITBUCKET }}
          DESKTOP_OAUTH_CLIENT_ID_GITLAB:
            ${{ secrets.DESKTOP_OAUTH_CLIENT_ID_GITLAB }}
          DESKTOP_OAUTH_CLIENT_SECRET_GITLAB:
            ${{ secrets.DESKTOP_OAUTH_CLIENT_SECRET_GITLAB }}
          DESKTOP_OAUTH_CLIENT_ID_CODEBERG:
            ${{ secrets.DESKTOP_OAUTH_CLIENT_ID_CODEBERG }}
          DESKTOP_OAUTH_CLIENT_SECRET_CODEBERG:
            ${{ secrets.DESKTOP_OAUTH_CLIENT_SECRET_CODEBERG }}
          DESKTOP_OAUTH_CLIENT_ID_GITEA:
            ${{ secrets.DESKTOP_OAUTH_CLIENT_ID_GITEA }}
          DESKTOP_OAUTH_CLIENT_SECRET_GITEA:
            ${{ secrets.DESKTOP_OAUTH_CLIENT_SECRET_GITEA }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APPLICATION_CERT: ${{ secrets.APPLE_APPLICATION_CERT }}
          KEY_PASSWORD: ${{ secrets.APPLE_APPLICATION_CERT_PASSWORD }}
          npm_config_arch: ${{ matrix.arch }}
          TARGET_ARCH: ${{ matrix.arch }}
      - name: Prepare testing environment
        run: yarn test:setup
        env:
          npm_config_arch: ${{ matrix.arch }}
      - name: Run unit tests
        if: |
          (runner.os == 'Windows' && matrix.arch == 'x64') || (runner.os == 'macOS' && matrix.arch == 'arm64') || (runner.os == 'Linux' && matrix.arch == 'x64')
        run: yarn test:unit
      - name: Run script tests
        run: yarn test:script
      - if: runner.os == 'Windows'
        uses: ./.github/actions/setup-windows-signing
        with:
          enabled: ${{ inputs.sign }}
          azure-client-id: ${{ secrets.AZURE_CODE_SIGNING_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_CODE_SIGNING_TENANT_ID }}
      - name: Package production app
        run: yarn package
        env:
          npm_config_arch: ${{ matrix.arch }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_CODE_SIGNING_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CODE_SIGNING_CLIENT_ID }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{matrix.friendlyName}}-${{matrix.arch}}
          path: |
            dist/*-macOS-*.zip
            dist/*.exe
            dist/*.msi
            dist/*.nupkg
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.sha256
            dist/bundle-size.json
            dist/bundle-hash.json
          if-no-files-found: error

  e2e-smoke:
    name: E2E Smoke ${{ matrix.friendlyName }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            friendlyName: macOS
            arch: arm64
          - os: windows-2022
            friendlyName: Windows
            arch: x64
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    env:
      RELEASE_CHANNEL: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          submodules: recursive
      - uses: ./.github/actions/setup-ci-environment
        with:
          node-version: ${{ env.NODE_VERSION }}
          arch: ${{ matrix.arch }}
          install-ffmpeg: 'true'
      - name: Build production app
        run: yarn build:prod
        env:
          DESKTOP_E2E_UPDATES_URL: http://127.0.0.1:51789/update
          DESKTOP_OAUTH_CLIENT_ID: ${{ secrets.DESKTOP_OAUTH_CLIENT_ID }}
          DESKTOP_OAUTH_CLIENT_SECRET:
            ${{ secrets.DESKTOP_OAUTH_CLIENT_SECRET }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APPLICATION_CERT: ${{ secrets.APPLE_APPLICATION_CERT }}
          KEY_PASSWORD: ${{ secrets.APPLE_APPLICATION_CERT_PASSWORD }}
          npm_config_arch: ${{ matrix.arch }}
          TARGET_ARCH: ${{ matrix.arch }}
      - name: Prepare testing environment
        run: yarn test:setup
        env:
          npm_config_arch: ${{ matrix.arch }}
      - if: runner.os == 'Windows'
        uses: ./.github/actions/setup-windows-signing
        with:
          enabled: ${{ inputs.sign }}
          azure-client-id: ${{ secrets.AZURE_CODE_SIGNING_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_CODE_SIGNING_TENANT_ID }}
      - name: Package production app
        run: yarn package
        env:
          npm_config_arch: ${{ matrix.arch }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_CODE_SIGNING_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CODE_SIGNING_CLIENT_ID }}
      - name: Install app on macOS
        if: runner.os == 'macOS'
        run: |
          rm -rf "/Applications/Desktop Claw.app"
          ditto "dist/Desktop Claw-darwin-arm64/Desktop Claw.app" "/Applications/Desktop Claw.app"
          echo "DESKTOP_E2E_APP_PATH=/Applications/Desktop Claw.app/Contents/MacOS/Desktop Claw" >> "$GITHUB_ENV"
      - name: Install app on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function Write-SquirrelLogs {
            $logPaths = @(
              "$env:LOCALAPPDATA\SquirrelSetup.log",
              "$env:LOCALAPPDATA\DesktopClaw\SquirrelSetup.log"
            )

            foreach ($logPath in $logPaths) {
              if (Test-Path $logPath) {
                Write-Host "Showing log: $logPath"
                Get-Content $logPath -Tail 200
              }
            }
          }

          $setupExe = Get-ChildItem "dist/DesktopClaw-*-windows-${{ matrix.arch }}.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $setupExe) {
            throw "Unable to locate Windows installer executable"
          }

          $installer = Start-Process -FilePath $setupExe -ArgumentList "/S" -PassThru

          try {
            Wait-Process -Id $installer.Id -Timeout 300 -ErrorAction Stop
          } catch {
            Write-SquirrelLogs
            throw "Windows installer timed out after 300 seconds"
          }

          Get-Process DesktopClaw -ErrorAction SilentlyContinue | Stop-Process -Force

          $installedExe = $null
          for ($attempt = 0; $attempt -lt 30 -and -not $installedExe; $attempt++) {
            $installedExe = Get-ChildItem "$env:LOCALAPPDATA\DesktopClaw\app-*\DesktopClaw.exe" -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName

            if (-not $installedExe) {
              Start-Sleep -Seconds 2
            }
          }

          if (-not $installedExe) {
            Write-SquirrelLogs
            throw "Unable to locate installed Desktop Claw executable"
          }

          Add-Content -Path $env:GITHUB_ENV -Value "DESKTOP_E2E_APP_PATH=$installedExe"
      - name: Run packaged E2E smoke tests
        run: yarn test:e2e:run:packaged
      - name: Upload E2E artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{matrix.friendlyName}}-${{matrix.arch}}
          path: playwright-videos/**
          if-no-files-found: warn

  release_github:
    name: Create GitHub release
    needs: [build, compute_version]
    runs-on: ubuntu-latest
    # Desktop Claw is distributed through GitHub Releases only. Every push to
    # main publishes a release stamped with its build time; workflow_dispatch
    # does the same on demand.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: write
    env:
      APP_VERSION: ${{ needs.compute_version.outputs.APP_VERSION }}
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: './artifacts'

      - name: Display structure of downloaded files
        run: ls -R
        working-directory: './artifacts'

      - name: Read release notes
        id: release_notes
        run: |
          # The title is derived from the stamped version; the file holds the
          # body only.
          BODY=$(cat ".github/desktop-claw-release-notes.md")
          {
            echo 'body<<EOF'
            echo "$BODY"
            echo EOF
          } >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # Creates the tag on the commit being built, since versions are
          # stamped at build time rather than tagged by hand beforehand.
          tag_name: v${{ env.APP_VERSION }}
          name: Desktop Claw v${{ env.APP_VERSION }}
          body: ${{ steps.release_notes.outputs.body }}
          # Windows, macOS and Linux, distributed here and nowhere else:
          # installers and OS-native packages, plus a portable AppImage.
          files: |
            artifacts/**/DesktopClaw-*.exe
            artifacts/**/DesktopClaw-*.msi
            artifacts/**/DesktopClaw-*.zip
            artifacts/**/DesktopClaw-*.deb
            artifacts/**/DesktopClaw-*.rpm
            artifacts/**/DesktopClaw-*.AppImage
          draft: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
